  "trans.port": ["TCP port", "For example 10443", "The TCP port where the FortiGate receives the VPN over TCP. It is a global setting: changing it drops every IPsec tunnel for a moment. It cannot match the HTTPS admin port or a VIP."],
  "trans.threshold": ["Fallback threshold (seconds)", "Empty = FortiOS value", "After how many seconds without a UDP answer the client tries TCP. 1 to 300.", true],
  "dial.exclude": ["Networks kept out of the tunnel", "One per line, for example 192.168.1.0/24", "With a full tunnel everything goes through the FortiGate. Here you list the networks that must stay out, reached directly from the user’s home: for example a cloud service that must not go through the office. If empty, everything goes through.", true],
  "dial.localLan": ["Allow the home network", "User’s printer, NAS, TV", "With a full tunnel users lose access to devices on their own home network. When on, FortiClient lets them reach the local LAN. It is set in the FortiClient file."],
  "dial.domains": ["Internal domains (split DNS)", "For example company.local", "Names ending with these domains are resolved by the VPN DNS; everything else by the user’s home DNS. Browsing stays fast and internal servers are found. Separate them with spaces or commas. Available from FortiOS 7.4.1. If empty, the VPN DNS resolves everything.", true],
  "dial.suffix": ["DNS suffixes", "For example company.local", "The client appends these suffixes to short names: typing «server01» finds «server01.company.local». Available from FortiOS 7.6.4.", true],
  "gwm.mode": ["Accept connections from", "Anywhere, unless security needs it", "Restricts who can even start negotiating. «From a network» or «from a range» if clients or branches have known IPs; «from a country» to block attempts from abroad. Needs FortiOS 7.4.4. Careful: anyone left out cannot connect even with the right credentials."],
  "gwm.subnet": ["Allowed network", "For example 203.0.113.0/24", "Only Internet addresses inside this network can connect. CIDR format."],
  "gwm.start": ["First allowed IP", "For example 203.0.113.10", "First Internet address of the range to accept connections from."],
  "gwm.end": ["Last allowed IP", "For example 203.0.113.50", "Last address of the range."],
  "gwm.country": ["Allowed country", "Two-letter code, for example IT", "Only addresses that the FortiGuard GeoIP database assigns to this country can connect. Users abroad, or on a mobile network exiting abroad, are left out."],
  "dual.holdType": ["Return to the primary tunnel", "At once in most cases", "When the primary line comes back, the FortiGate moves back to the first tunnel. «At once» does it as soon as possible; «after a delay» waits a few seconds, useful if the primary line keeps flapping."],
  "dual.holdDelay": ["Delay (seconds)", "For example 60", "How many seconds of stable primary line before moving back to it."],
  "fec.on": ["Error correction (FEC)", "Only on lossy lines", "For every group of packets the FortiGate sends a few correction packets: if a packet is lost, the other side rebuilds it without retransmission. Useful on 4G, satellite or radio links, for voice and video. It costs bandwidth and turns off the tunnel’s hardware acceleration. It is enabled on both sides."],
  "fec.base": ["Base packets", "Empty = 20", "After how many normal packets the correction group is sent. 1 to 40.", true],
  "fec.redundant": ["Correction packets", "Empty = 10", "How many correction packets per group. More of them recover more losses and use more bandwidth: with 20 base and 10 correction traffic grows by about 50%. 1 to 20.", true],
  "bx.autoLink": ["When you add a node", "To the hub in most cases", "To the hub: the new node gets a session and an IPsec tunnel to the route reflector. To everyone: a session and a tunnel to every existing FortiGate (full mesh, N·(N−1)/2 tunnels). Manually: the node starts with no sessions. Tunnels and sessions stay editable one by one."],
  "bx.pool": ["Network for tunnel IPs", "For example 169.254.100.0/24", "Fortissimo takes a /30 from this network for each generated tunnel between FortiGates with a public IP. Use a network that exists in no LAN. IPs stay editable in the session."],
  "bn.wan": ["WAN interface", "For example wan1", "The FortiGate Internet port where generated IPsec tunnels start. Each tunnel can use another one."],
  "bn.pubIp": ["Public IP", "For example 203.0.113.20", "The address the other FortiGates connect to. If the IP changes use the FQDN, or mark the node as dynamic IP.", true],
  "bn.fqdn": ["FQDN", "For example site.fortiddns.com", "DNS name of the FortiGate when the public IP changes: the other sides use remotegw-ddns.", true],
  "bn.dyn": ["Dynamic IP or behind NAT", "Nobody can call this FortiGate", "The node calls the others but cannot be called. Toward a node with a public IP the tunnel becomes dial-up: the other side acts as hub with a shared tunnel and accepts BGP with neighbor-range."],
  "bn.dialName": ["Dial-up tunnel name", "For example DIAL_BGP", "The shared tunnel this FortiGate accepts every dynamic-IP spoke on. Up to 15 characters."],
  "bn.overlay": ["Dynamic spoke network", "For example 169.254.200.0/24", "Network the hub and the dynamic spokes take their tunnel IP from. The hub accepts BGP from this whole network; the last address is reserved."],
  "bn.dialIp": ["Hub IP in the spoke network", "For example 169.254.200.1", "The dial-up tunnel address on this FortiGate: spokes use it as BGP neighbor."],
  "bl.ipsec": ["Generate the IPsec tunnel", "On for FortiGates linked over the Internet", "Fortissimo creates phase1, phase2 and tunnel IP on both nodes, with the IPsec section cryptography and the single PSK. Turn it off if the tunnel already exists."],
  "bl.tname": ["Tunnel name", "Up to 15 characters", "Name of the phase1 and of the tunnel interface on this FortiGate. Proposed automatically, you can change it."],
  "bl.twan": ["Tunnel WAN", "Empty = the tunnel’s line, in grey", "Interface this tunnel starts from. Change it to run a second tunnel over another line."],
  "bl.tgw": ["Remote gateway", "Empty = the other site’s line address, in grey", "The address this FortiGate connects to. Change it when the other node has several lines and this tunnel must use another one.", true],
  "bl.tip": ["Tunnel IP", "Assigned automatically", "Tunnel interface address on this FortiGate: the other side uses it as BGP neighbor. The two IPs sit in the same /30."],
  "bl.cOwn": ["Own cryptography", "Off = the IPsec section one", "Turn it on if this tunnel must use different proposals or DH groups, for example toward an older device. It starts from a copy of the IPsec section cryptography."],
  "bx.multipath": ["Multipath", "With several sessions to the same site", "With several sessions to the same site the FortiGate uses all equal paths together instead of a single one (ibgp-multipath and ebgp-multipath). Useful with two parallel tunnels; off when a path must only be a backup."],
  "bn.name": ["Name", "For example Milan or Provider", "Identifies the node in the diagram, in the neighbor description (set description) and in the tab name. For an IPsec tunnel side, empty uses that side’s name.", true],
  "bn.as": ["AS", "For example 65001", "The node’s BGP number. Same AS on two nodes = iBGP session, different ASes = eBGP. Between your sites use private ASes (64512–65534); toward a provider use the AS agreed with it."],
  "ms.sdwan": ["Several lines per site", "Optional", "Each site can have up to 8 lines (fibre, FWA, LTE, Starlink, private lines such as MPLS, radio links or satellite). Fortissimo creates a tunnel for each line pair between two sites and groups them: in an SD-WAN zone, with health-checks and rules picking the best tunnel, or in one IPsec aggregate per site pair, which uses them all together.", true],
  "ms.col.lan": ["LAN interface", "For example lan, internal or a VLAN", "The FortiGate interface the site’s internal network sits on. The generated firewall policies go from here to the SD-WAN zone and back."],
  "ms.col.type": ["Line type", "Cable, satellite, LTE/5G or private", "The type gives the line letter in code names (W cable or fibre, S satellite, L LTE) and drops impossible pairs automatically. A private line (MPLS, radio link, dedicated satellite link) reaches only the private lines on the same network: type the network name in the field that appears, the same on every site sharing it (for example MPLS1, or SAT-MIL for a dedicated link between two sites). As address use the site’s IP on that network. Cable, satellite and LTE reach each other over the Internet; use the cost to decide how much to use them."],
  "ms.col.cost": ["Cost", "0 for the main line, more for the others", "A tunnel’s cost is the sum of its two lines’ costs. Among the tunnels meeting the SLA thresholds the FortiGate uses the cheapest: give metered lines such as LTE a high cost."],
  "ms.zone": ["SD-WAN zone", "For example VPN", "The group holding every tunnel of the site. Firewall policies and SD-WAN rules use the zone, so adding a tunnel needs no new policy. Do not use virtual-wan-link, which usually holds the Internet lines."],
  "ms.lat": ["Latency threshold (ms)", "For example 150", "Above this average latency to the other site the tunnel is out of SLA and the FortiGate moves to another tunnel, if any."],
  "ms.jit": ["Jitter threshold (ms)", "For example 30", "Latency variation beyond which the tunnel is out of SLA. It matters most for voice and video."],
  "ms.loss": ["Packet loss threshold (%)", "For example 2", "Share of lost packets beyond which the tunnel is out of SLA."],
  "ms.pol": ["Generate the firewall policies", "Recommended", "LAN to zone and back on every site; on the hub (or in an eBGP full mesh) also zone to zone for transit; on the health-check target sites the ping to the loopback. The service is ALL: narrow it to what you need."],
  "ms.ipPlan": ["Tunnel addresses", "In sequence, or per site as in structured plans", "In sequence: each tunnel takes the first free /30 (or /31) of the tunnel network. Per site: the tunnel network is split into one /24 per site. The tunnel between site i and site j (i < j) sits in /24 number i, at site j’s position, and site i takes the first address; /24 zero holds the router IDs. With 10.255.0.0/16 the tunnel between site 2 and site 3 is 10.255.2.5 – 10.255.2.6 and site 3’s router ID is 10.255.0.3: the address tells at once which sites it joins. It needs a network with one /24 per site plus one."],
  "ms.grp": ["How to group the tunnels", "SD-WAN zone in most cases", "SD-WAN zone: each tunnel has its own IP and BGP session; health-checks and SLA rules pick the best tunnel by cost and quality. IPsec aggregate: for each site pair the tunnels become a single interface (config system ipsec-aggregate) with one IP and one BGP session; the FortiGate spreads traffic over every live tunnel and drops the ones DPD declares dead. In this mode Fortissimo creates static tunnels only, as in Fortinet’s examples (dial-up members are not documented): a dynamic-IP line works only if it has an FQDN (DDNS)."],
  "ms.alg": ["Balancing algorithm", "L4 in most cases", "How the aggregate spreads traffic over the live tunnels. L4: per session, by IPs and ports, so a connection’s packets stay on the same tunnel. L3: per source and destination IP pair. Round-robin: one packet per tunnel in turn; it uses all the bandwidth but may reorder packets when the lines have different latencies. Redundant: everything on the first live tunnel, the others stay as backup; the first is the one with the lowest cost."],
  "ms.zoneAgg": ["Zone", "For example VPN", "A FortiGate zone (config system zone) holding the aggregates to every other site. Firewall policies use the zone; with intrazone allow traffic between two aggregates of the same zone passes without a policy, so the hub, or a third site in an eBGP full mesh, can act as transit."],
  "ms.polAgg": ["Generate the firewall policies", "Recommended", "LAN to zone and back on every site, with the NET_<site> and NET_VPN_REMOTE addresses. Transit between aggregates is already allowed by intrazone allow. The service is ALL: narrow it to what you need."],
  "ms.names": ["Tunnel names", "From the site name or with short codes", "From the name: T_Milan, or T_Milan_12 with several lines. With codes every site and line has a tag: a tunnel is named local site and line, dash, remote site and line. MILW-ROML is Milan’s line W (cable) toward Rome’s line L (LTE); MILS2-ROMW is Milan’s second satellite line toward Rome’s cable; the aggregate between the two sites is MIL-ROM. Codes are derived automatically and you can change them in the site and line tables. A FortiGate interface has 15 characters at most."],
  "ms.dpdInt": ["DPD interval (seconds)", "Empty = FortiGate default (20 s)", "How often the FortiGate retries the DPD check when a tunnel does not answer (dpd-retryinterval); after a few failed attempts the tunnel is declared dead. A low value, such as 2–5 s, shortens the failover: it matters most with the IPsec aggregate, which drops a tunnel from the balancing only when DPD declares it dead."],
  "ms.col.code": ["Code", "Optional: empty = derived automatically", "The name is for you: it shows in the tabs, in the BGP neighbor description and in comments, and it can be long. The code is a short tag used only to build tunnel names, because a FortiGate interface name has 15 characters at most. When empty, the site takes the initials of its name (Head office → HO, Branch 2 → B2) or the first three letters of a single word (Milan → MIL). The line takes its type: W cable or fibre, S satellite, L LTE; a private line takes its network name (MPLS, RADI…). From the second line of the same type a number is added: W, W2. Letters and digits only, 8 at most."],
  "ms.base": ["First number for members and rules", "For example 100", "The generated SD-WAN members and rules start from this number, so they do not overwrite the FortiGate’s existing ones, such as the Internet lines."],
  "ms.col.name": ["Name", "For example Milan", "The site name. It appears in the output tabs, in the BGP neighbor description, in the blackhole route comments and in the other sites’ tunnel names (for example T_Milan). With code names, tunnel names use the site code instead of the name."],
  "ms.col.wan": ["WAN", "For example wan1", "The FortiGate Internet interface this site’s IPsec tunnels leave from. Write it as it appears on the FortiGate (wan1, port1; not an SD-WAN zone: an interface is needed)."],
  "ms.col.addr": ["Public IP or FQDN", "For example 203.0.113.10 or vpn.site.com", "The address the other sites use to reach this FortiGate: it becomes the remote gateway of their tunnels. With the dial-up tunnel on the hub only the hub needs it, because the branches call the hub."],
  "ms.col.dyn": ["Dynamic IP", "If the public IP changes or the site is behind NAT", "The site cannot be called: it calls the others, which accept it on a dial-up tunnel. Two sites with a dynamic IP cannot have a direct tunnel between them."],
  "ms.col.nets": ["LAN networks", "Several networks separated by commas: 192.168.10.0/24, 192.168.11.0/24", "The site’s internal networks the other sites must reach: users, servers, VLANs. Each one becomes a config network line in this site’s BGP and a blackhole route on the other sites. The FortiGate announces a network only if it is in its routing table (network-import-check): it must exist as an interface, VLAN or static route. You can also give a wider network covering them, for example 10.10.0.0/16, if a route for that network exists."],
  "ms.count": ["How many sites", "From 2 to 30", "Each site is a FortiGate with its own tab in the output. With hub and spoke there is one tunnel per branch; in full mesh one per pair of sites, N·(N−1)/2."],
  "ms.topo": ["Topology", "Hub and spoke in most cases", "Hub and spoke: each branch has a tunnel to the central site and traffic between branches goes through the hub. Full mesh: a tunnel between every pair of sites, traffic goes direct but tunnels grow fast (10 sites = 45 tunnels). Custom: you decide tunnels and sessions, one session at a time."],
  "ms.hub": ["Central site (hub)", "The site with a fixed public IP", "Spokes call the hub, so it needs a reachable public IP or FQDN. With iBGP the hub is also the route reflector."],
  "ms.hubMode": ["Tunnels on the hub", "One dial-up tunnel in most cases", "One dial-up tunnel: on the hub a single phase1 accepts every branch, dynamic IPs included, and a new branch changes only the hub’s BGP. One tunnel per spoke: a dedicated phase1 for each branch with a fixed IP, useful if you want different WANs or cryptography per branch; branches with a dynamic IP still use the dial-up tunnel."],
  "ms.bgpType": ["BGP type", "iBGP for hub and spoke, eBGP for full mesh", "iBGP: every site in the same AS; with hub and spoke the hub is the route reflector and passes each branch the networks of the others. eBGP: each site has its own AS; in a full mesh, if a tunnel drops, traffic can go through another site."],
  "ms.baseAs": ["Starting AS", "A private AS, for example 65000", "With iBGP every site uses this AS. With eBGP the hub, or the first site, uses this number and the others the next ones: 65001, 65002 and so on."],
  "ms.asManual": ["Hand-picked AS numbers", "Optional", "Off, AS numbers follow the BGP type. On, you set each site’s AS in «Per-site options».", true],
  "ms.advpn": ["Shortcuts between branches (ADVPN)", "Optional", "When two branches talk, the hub offers them a direct tunnel and traffic stops going through the hub (auto-discovery). Needs iBGP with the dial-up tunnel on the hub.", true],
  "ms.pool": ["Network for fixed-IP tunnels", "For example 169.254.100.0/24", "Fortissimo proposes the addresses of tunnels between two fixed-IP sites from here, one /30 or /31 per tunnel. Use a network that exists in no LAN. You can always change a single address in the «Tunnel addresses» table."],
  "ms.p2pPrefix": ["Mask of fixed-IP tunnels", "/30 in most cases", "How many addresses each tunnel takes in the network above. /30 uses four addresses, two of them usable; /31 uses just two, both usable. When you change it, Fortissimo reassigns the addresses it proposed; hand-typed ones stay."],
  "ms.loName": ["Loopback name", "For example lo_bgp", "A loopback is a FortiGate virtual interface that is always up, because it depends on no cable or tunnel. In BGP it lets the session start from an address that never goes down (update-source). Here it matters only for «over loopbacks» sessions in the custom topology; if the loopback already exists, type its name."],
  "ms.loIp": ["Loopback IP", "For example 10.255.0.1/32, often the same as the router ID", "The loopback’s /32 address. BGP does not need it: in hub and spoke and full mesh Fortissimo uses the tunnel IPs and loopbacks are not needed. They help when two sites have several links (for example two tunnels over two WANs) and you want a single BGP session that stays up when one drops: the session runs loopback to loopback and each FortiGate reaches the other’s loopback over any tunnel that is up."],
  "ms.dialName": ["Dial-up tunnel name", "15 characters at most", "The hub phase1 that accepts the branches."],
  "ms.overlay": ["Branch network on the dial-up tunnel", "/24 to /30, for example 169.254.200.0/24", "The hub and the branches take an address from this network on the tunnel interface; BGP uses these addresses as neighbors. The last address stays free as the hub’s dummy remote-ip."],
  "ms.dialIp": ["Hub IP on the dial-up tunnel", "For example 169.254.200.1", "The BGP neighbor every branch configures."],
  "ms.sites": ["Sites", "", "Name, WAN interface, public address and internal networks of each FortiGate. With the dial-up tunnel on the hub the branches need no public address: they call the hub."],
  "bn.rid": ["Router ID", "For example 10.255.0.1", "An identifier in IP format, unique per FortiGate. If missing the FortiGate picks one and may change it when interfaces change; fixing it keeps sessions and troubleshooting stable.", true],
  "bn.rr": ["Route reflector", "On the hub with many iBGP branches", "In iBGP a router does not pass routes learned from an iBGP neighbor to other iBGP neighbors: every pair would need a session. With a route reflector the hub reflects routes to all branches (route-reflector-client on the neighbors)."],
  "bn.ext": ["External peer", "Provider or non-FortiGate device", "The node is not a FortiGate to configure: Fortissimo makes no tab for it but uses it as the others’ neighbor. For providers, other vendors’ routers or FortiGates managed by someone else."],
  "bn.loName": ["Loopback name", "For example lo_bgp", "An always-up virtual interface BGP starts from (update-source). Up to 15 characters. If it already exists, type its name: Fortissimo creates it in vdom root."],
  "bn.loIp": ["Loopback IP", "For example 10.255.0.1", "The loopback’s /32 address. Needed for loopback sessions: BGP stays up when one link drops, as long as the loopback is reachable over another. Often the same as the router ID.", true],
  "bn.nets": ["Announced networks", "One per line, for example 192.168.10.0/24", "The networks the node announces with config network. The FortiGate announces them only if they are in its routing table. For an IPsec tunnel side, empty uses its local networks.", true],
  "bn.redisConn": ["Redistribute connected networks", "Better with a route-map", "Announces the networks of every FortiGate interface, WAN and management included unless a route-map filters them. Handy with many VLANs."],
  "bn.redisStatic": ["Redistribute static routes", "Better with a route-map", "Announces the FortiGate static routes, the default one included unless filtered. Use it with a route-map that lets through only what is needed."],
  "bn.redisRm": ["Redistribution route-map", "For example RM_REDIST", "Filters what is redistributed. The name must match a route-map defined below.", true],
  "bl.a": ["Side A", "The first node", "One of the two nodes of the session. With dynamic-IP spokes side A is the hub."],
  "bl.b": ["Side B", "The second node", "The other node of the session. With dynamic-IP spokes side B is the spoke."],
  "bl.kind": ["Link", "Tunnel or physical link", "Tunnel: an IPsec or GRE interface, with the neighbor in the tunnel network. Physical link: a direct port or VLAN between the two devices, for example a cable between sites or the provider line."],
  "bl.loop": ["Session over loopbacks", "Off unless there are several links", "The session starts from the loopback instead of the interface: with several links between the same nodes it stays up while one works. Fortissimo generates the loopback, the route to the peer’s one and update-source; in eBGP it adds ebgp-enforce-multihop."],
  "bl.if": ["Interface", "For example VPN_to_B or port3", "The FortiGate interface toward the neighbor: tunnel or port name, exactly as in Network → Interfaces. Up to 15 characters."],
  "bl.ip": ["IP on the link", "For example 169.254.10.1", "This node’s address on the link: the other node uses it as neighbor address. Fortissimo does not set it on the interface, which must already have it; for IPsec tunnels the IPsec part sets it."],
  "bl.dyn": ["Dynamic-IP spokes", "The hub accepts spokes from a network", "The hub does not know the spoke IPs in advance: it accepts BGP from any address of the given network, with neighbor-group and neighbor-range. Side A is the hub."],
  "bl.range": ["Spoke network", "For example 169.254.20.0/24", "The network the hub accepts spoke BGP sessions from. Spoke tunnel IPs must be inside it."],
  "bl.bfd": ["BFD", "To notice failures in under a second", "BFD checks the link far more often than the BGP keepalive: if it drops, the session closes at once and backup routes take over. Fortissimo enables it on the neighbor and on the interface, on both sides."],
  "bl.rmIn": ["Inbound route-map", "For example RM_PRIMARY", "Changes or filters the routes received from this neighbor, for example raising local-preference to prefer this path.", true],
  "bl.rmOut": ["Outbound route-map", "For example RM_BACKUP", "Changes or filters the routes announced to this neighbor, for example with a prepend to make it less preferred on the other side.", true],
  "bl.plIn": ["Inbound prefix-list", "For example PL_ISP_IN", "Accepts from this neighbor only the prefixes the prefix-list permits. Essential toward a provider.", true],
  "bl.plOut": ["Outbound prefix-list", "For example PL_ISP_OUT", "Announces to this neighbor only the permitted prefixes. Toward a provider announce only your public networks.", true],
  "bl.max": ["Maximum-prefix", "For example 10 if the provider sends only the default", "If the neighbor announces more prefixes than this, the session is closed. It protects the routing table from peer mistakes.", true],
  "bl.def": ["Announce the default route", "Usually from the hub to branches", "The FortiGate announces 0.0.0.0/0 to this neighbor (capability-default-originate). Useful from the hub to branches that reach the Internet through head office; toward a provider it is almost always a mistake."],
  "bl.nhs": ["Next-hop-self", "On the hub toward branches", "The FortiGate sets itself as next-hop in the routes it announces to this neighbor. On a route reflector it becomes next-hop-self-rr: branches receive the other branches’ routes with the hub as next-hop, which they can reach."],
  "bp.plName": ["Name", "For example PL_LAN", "Prefix-list name: letters, digits, dot, dash or underscore, up to 35 characters. Sessions refer to it by this name."],
  "bp.plRules": ["Rules", "One per line: permit 10.0.0.0/8 le 24", "Each line is a rule, in order: permit or deny, then a CIDR network or any, then optional ge and le. Without ge and le the network must match exactly: 0.0.0.0/0 is only the default route. 10.0.0.0/8 le 24 = every network inside 10.0.0.0/8 up to /24. An implicit deny follows."],
  "bp.rmName": ["Name", "For example RM_PRIMARY", "Route-map name: letters, digits, dot, dash or underscore, up to 35 characters. Sessions refer to it by this name."],
  "bp.rmRules": ["Rules", "One per line: permit match PL_LAN local-pref 200", "Each line is a rule, in order: permit or deny, then optional match <prefix-list>, local-pref <n>, med <n>, prepend <times, 1–10>, community 65001:100 (several values comma separated) and additive. A rule without match applies to every prefix; prefixes matching no rule are dropped."]
}};

/* Fortissimo — catalogo opzioni avanzate (FortiOS 7.4.2 CLI reference)
   sides: lati a cui si applica per scenario. rec: valore del preset per scenario e lato (null = predefinito FortiOS). */
const ALL_SC = ["s2s", "s2sdyn", "dialup"];
const BOTH = { s2s: ["a", "b"], s2sdyn: ["a", "b"], dialup: ["a"], native: ["a"] };
const HUB = { s2sdyn: ["a"], dialup: ["a"], native: ["a"] };
const STATIC_SIDES = { s2s: ["a", "b"], s2sdyn: ["b"] };

const OPTS = [
  // Resilienza
  { k: "p1.dpd", cli: "dpd", type: "enum", vals: ["on-idle", "on-demand", "disable"], def: "on-demand", sec: "resil", lvl: "essential", sides: BOTH,
    rec: () => "on-idle",
    it: ["Dead Peer Detection (DPD)", "Controllo che l’altro lato sia ancora vivo", "Il FortiGate manda ogni tanto un «ci sei?» all’altro lato. on-idle lo fa solo quando non passa traffico: si accorge presto di un tunnel morto senza sprecare banda. on-demand controlla solo quando deve inviare traffico. disable non controlla mai: un tunnel morto resta «su» finché le chiavi non scadono, anche ore. Con due linee Internet serve on-idle."],
    en: ["Dead Peer Detection (DPD)", "Checks the other side is still alive", "The FortiGate sends an occasional «are you there?» to the other side. on-idle does it only when no traffic flows: it spots a dead tunnel quickly without wasting bandwidth. on-demand checks only when it has traffic to send. disable never checks: a dead tunnel stays «up» until keys expire, even hours. With two Internet lines you need on-idle."] },
  { k: "p1.dpd-retrycount", cli: "dpd-retrycount", type: "num", min: 0, max: 10, def: "3", sec: "resil", lvl: "expert", sides: BOTH,
    it: ["Tentativi DPD", "Quanti «ci sei?» senza risposta prima di arrendersi", "Dopo questo numero di controlli senza risposta il tunnel viene dichiarato caduto. Alzalo su linee che perdono pacchetti (4G, satellite) per evitare cadute finte; abbassalo per accorgerti prima dei guasti veri."],
    en: ["DPD retries", "How many unanswered «are you there?» before giving up", "After this many unanswered checks the tunnel is declared down. Raise it on lossy lines (4G, satellite) to avoid false drops; lower it to notice real failures sooner."] },
  { k: "p1.dpd-retryinterval", cli: "dpd-retryinterval", type: "num", min: 1, max: 3600, sec: "resil", lvl: "expert", sides: BOTH,
    it: ["Intervallo DPD (secondi)", "Attesa tra un controllo e il successivo", "Tempo tra un «ci sei?» e il successivo. Tempo totale per dichiarare il tunnel caduto = intervallo × tentativi. Valori bassi = guasti scoperti prima; valori alti = più tolleranza alle linee instabili. Con due linee Internet usa lo stesso valore sui due lati."],
    en: ["DPD interval (seconds)", "Wait between one check and the next", "Time between one «are you there?» and the next. Total time to declare the tunnel down = interval × retries. Low values = failures found sooner; high values = more tolerance for unstable lines. With two Internet lines use the same value on both sides."] },
  { k: "p2.auto-negotiate", scope: "p2", cli: "auto-negotiate", type: "enum", vals: ["enable", "disable"], def: "disable", sec: "resil", lvl: "essential", sides: STATIC_SIDES,
    rec: (sc, side) => (sc === "s2s" || (sc === "s2sdyn" && side === "b")) ? "enable" : null,
    it: ["Avvio automatico phase2", "Alza il tunnel senza aspettare traffico", "Senza questa opzione il tunnel si apre solo quando qualcuno manda traffico, e i primi pacchetti possono andare persi (il primo ping fallisce). Con l’opzione attiva il tunnel è sempre pronto. Consigliato tra due sedi."],
    en: ["Phase2 auto-negotiate", "Brings the tunnel up without waiting for traffic", "Without it the tunnel opens only when someone sends traffic, and the first packets may be lost (the first ping fails). With it on the tunnel is always ready. Recommended between two sites."] },
  { k: "p2.keepalive", scope: "p2", cli: "keepalive", type: "enum", vals: ["enable", "disable"], def: "disable", sec: "resil", lvl: "essential", sides: STATIC_SIDES,
    rec: (sc, side) => (sc === "s2s" || (sc === "s2sdyn" && side === "b")) ? "enable" : null,
    it: ["Keepalive phase2", "Tiene vivo il tunnel anche senza traffico", "Rinnova la phase2 anche quando la linea è silenziosa, così il tunnel non scade di notte o nel weekend. Consigliato tra due sedi."],
    en: ["Phase2 keepalive", "Keeps the tunnel alive without traffic", "Renews phase2 even when the line is silent, so the tunnel does not expire at night or at weekends. Recommended between two sites."] },
  { k: "p1.auto-negotiate", cli: "auto-negotiate", type: "enum", vals: ["enable", "disable"], def: "enable", sec: "resil", lvl: "expert", sides: STATIC_SIDES,
    it: ["Avvio automatico IKE", "Il FortiGate avvia la VPN da solo", "Normalmente entrambi i lati provano ad alzare la VPN. Spegnilo solo se questo lato deve limitarsi ad aspettare che sia l’altro a chiamare."],
    en: ["IKE auto-negotiate", "The FortiGate starts the VPN on its own", "Normally both sides try to bring the VPN up. Turn it off only if this side must just wait for the other one to call."] },
  { k: "p1.negotiate-timeout", cli: "negotiate-timeout", type: "num", min: 1, max: 300, def: "30", sec: "resil", lvl: "expert", sides: BOTH,
    it: ["Timeout negoziazione (secondi)", "Tempo massimo per stabilire la VPN", "Quanto tempo ha la negoziazione per completarsi. Il valore di fabbrica (30 secondi) basta quasi sempre; alzalo se gli utenti devono fare una MFA lenta (codice, notifica, login Microsoft) e il collegamento scade prima."],
    en: ["Negotiation timeout (seconds)", "Maximum time to set up the VPN", "How long negotiation has to complete. The factory value (30 seconds) is almost always enough; raise it if users must go through a slow MFA (code, notification, Microsoft sign-in) and the connection times out first."] },

  // Trasporto e frammentazione
  { k: "p1.nattraversal", cli: "nattraversal", type: "enum", vals: ["enable", "disable", "forced"], def: "enable", sec: "trans", lvl: "expert", sides: BOTH,
    it: ["NAT traversal", "Fa passare la VPN dietro un router con NAT", "Se c’è un router che traduce gli indirizzi (NAT) tra i due lati, la VPN viene incapsulata in UDP 4500 per passarlo. enable lo fa solo quando serve, ed è la scelta giusta. forced lo usa sempre: serve se un apparato in mezzo blocca il protocollo ESP anche senza NAT."],
    en: ["NAT traversal", "Lets the VPN cross a router doing NAT", "If a router translating addresses (NAT) sits between the sides, the VPN is wrapped in UDP 4500 to get through. enable does it only when needed, and is the right choice. forced always does it: needed if a device in between blocks the ESP protocol even without NAT."] },
  { k: "p1.keepalive", cli: "keepalive", type: "num", min: 5, max: 900, def: "10", sec: "trans", lvl: "expert", sides: BOTH,
    it: ["Keepalive NAT-T (secondi)", "Ogni quanto tenere aperta la porta sul NAT", "I router con NAT chiudono le «porte» inattive dopo un po’. Questo invio periodico le tiene aperte. Abbassalo se il tunnel cade dopo un periodo di silenzio, ad esempio dietro router 4G."],
    en: ["NAT-T keepalive (seconds)", "How often to keep the NAT port open", "Routers doing NAT close idle «ports» after a while. This periodic packet keeps them open. Lower it if the tunnel drops after a quiet period, for example behind 4G routers."] },
  { k: "p1.fragmentation", cli: "fragmentation", type: "enum", vals: ["enable", "disable"], def: "enable", sec: "trans", lvl: "expert", sides: BOTH,
    it: ["Frammentazione IKE", "Spezza i messaggi IKE troppo grandi", "Con i certificati i messaggi della negoziazione diventano grandi e alcune linee li scartano. Questa opzione li spezza in pezzi più piccoli. Lasciala attiva; spegnila solo se l’altro lato non la supporta."],
    en: ["IKE fragmentation", "Splits IKE messages that are too large", "With certificates negotiation messages get large and some lines drop them. This option splits them into smaller pieces. Keep it on; turn it off only if the other side does not support it."] },
  { k: "p1.fragmentation-mtu", cli: "fragmentation-mtu", type: "num", min: 500, max: 16000, def: "1200", sec: "trans", lvl: "expert", sides: BOTH,
    it: ["Dimensione dei frammenti IKE", "In byte", "Dimensione massima di ogni pezzo quando la frammentazione IKE è attiva. Abbassala su linee con MTU ridotta, come PPPoE o 4G, se la negoziazione con certificati non va a buon fine."],
    en: ["IKE fragment size", "In bytes", "Maximum size of each piece when IKE fragmentation is on. Lower it on lines with a reduced MTU, such as PPPoE or 4G, if negotiation with certificates fails."] },
  { k: "p1.ip-fragmentation", cli: "ip-fragmentation", type: "enum", vals: ["post-encapsulation", "pre-encapsulation"], def: "post-encapsulation", sec: "trans", lvl: "expert", sides: BOTH,
    it: ["Frammentazione dei pacchetti", "Prima o dopo la cifratura", "Quando un pacchetto è troppo grande per la linea va spezzato. post-encapsulation (predefinito) lo spezza dopo averlo cifrato, come prevede lo standard. pre-encapsulation lo spezza prima: l’altro lato non deve ricomporlo, e a volte risolve problemi di velocità su linee con MTU ridotta."],
    en: ["Packet fragmentation", "Before or after encryption", "When a packet is too large for the line it must be split. post-encapsulation (default) splits it after encrypting, as the standard says. pre-encapsulation splits it before: the other side does not have to reassemble it, and it sometimes fixes speed problems on lines with a reduced MTU."] },
  { k: "p1.npu-offload", cli: "npu-offload", type: "enum", vals: ["enable", "disable"], def: "enable", sec: "trans", lvl: "expert", sides: BOTH,
    it: ["Accelerazione hardware", "Cifratura nel chip dedicato", "I FortiGate hanno un chip (NPU) che cifra molto più velocemente della CPU. Lascialo attivo; spegnilo solo su indicazione del supporto per una diagnosi."],
    en: ["Hardware acceleration", "Encryption in the dedicated chip", "FortiGates have a chip (NPU) that encrypts much faster than the CPU. Keep it on; turn it off only when support asks, for troubleshooting."] },

  // Sessioni client (dial-up e hub)
  { k: "p1.net-device", cli: "net-device", type: "enum", vals: ["disable", "enable"], def: "disable", sec: "dialadv", lvl: "essential", sides: HUB,
    rec: () => "disable",
    it: ["Interfaccia per ogni client", "Una interfaccia condivisa o una per connessione", "Con disable (consigliato) tutti i client o le filiali condividono la stessa interfaccia: il FortiGate regge molte più connessioni. enable crea un’interfaccia per ognuno: serve solo in alcuni progetti con routing dinamico particolare."],
    en: ["Interface per client", "One shared interface or one per connection", "With disable (recommended) all clients or branches share the same interface: the FortiGate handles many more connections. enable creates one interface each: needed only in some designs with special dynamic routing."] },
  { k: "p1.add-route", cli: "add-route", type: "enum", vals: ["enable", "disable"], def: "enable", sec: "dialadv", lvl: "essential", sides: HUB,
    rec: (sc) => sc === "s2sdyn" ? "enable" : null,
    it: ["Rotte automatiche dai selettori", "L’hub impara le reti dei client", "Quando una filiale o un client si collega, il FortiGate aggiunge da solo la rotta verso le sue reti. Indispensabile nei dial-up senza BGP; con il BGP Fortissimo lo spegne perché le reti arrivano dal BGP."],
    en: ["Automatic routes from selectors", "The hub learns client networks", "When a branch or client connects, the FortiGate adds the route to its networks by itself. Essential for dial-up without BGP; with BGP Fortissimo turns it off because networks arrive via BGP."] },
  { k: "p1.distance", cli: "distance", type: "num", min: 1, max: 255, def: "15", sec: "dialadv", lvl: "expert", sides: HUB,
    it: ["Distanza delle rotte automatiche", "Priorità delle rotte aggiunte dalla VPN", "Più è bassa, più quelle rotte hanno la precedenza su altri percorsi verso le stesse reti. Cambiala solo se hai percorsi alternativi da far prevalere."],
    en: ["Automatic route distance", "Priority of routes added by the VPN", "The lower it is, the more those routes win over other paths to the same networks. Change it only if you have alternative paths that must win."] },
  { k: "p1.idle-timeout", cli: "idle-timeout", type: "enum", vals: ["disable", "enable"], def: "disable", sec: "dialadv", lvl: "expert", sides: { dialup: ["a"], native: ["a"] },
    it: ["Disconnessione per inattività", "Chiude i client che non usano la VPN", "Se un utente resta collegato senza usare la VPN, dopo il tempo indicato viene disconnesso. Libera indirizzi del pool e chiude sessioni dimenticate aperte."],
    en: ["Idle disconnect", "Closes clients not using the VPN", "If a user stays connected without using the VPN, they are disconnected after the given time. Frees pool addresses and closes forgotten sessions."] },
  { k: "p1.idle-timeoutinterval", cli: "idle-timeoutinterval", type: "num", min: 5, max: 43200, def: "15", sec: "dialadv", lvl: "expert", sides: { dialup: ["a"], native: ["a"] }, dep: ["p1.idle-timeout", "enable"],
    it: ["Minuti di inattività", "Da 5 a 43200 minuti", "Dopo quanti minuti senza traffico il client viene disconnesso."], en: ["Idle minutes", "5 to 43200 minutes", "After how many minutes without traffic the client is disconnected."] },
  { k: "p1.client-keep-alive", cli: "client-keep-alive", type: "enum", vals: ["disable", "enable"], def: "disable", sec: "dialadv", lvl: "expert", sides: { dialup: ["a"] },
    it: ["Keepalive del client", "Il client tiene su il tunnel senza traffico", "Utile per programmi che restano collegati a lungo senza scambiare dati, come un gestionale aperto in pausa pranzo."],
    en: ["Client keepalive", "The client keeps the tunnel up without traffic", "Useful for programs that stay connected for a long time without exchanging data, like an ERP left open over lunch."] },
  { k: "p1.client-auto-negotiate", cli: "client-auto-negotiate", type: "enum", vals: ["disable", "enable"], def: "disable", sec: "dialadv", lvl: "expert", sides: { dialup: ["a"] },
    it: ["Avvio automatico dal client", "Il client alza il tunnel da solo", "Permette al client di alzare il tunnel anche senza traffico in uscita. Normalmente non serve."],
    en: ["Client auto-negotiate", "The client brings the tunnel up by itself", "Lets the client bring the tunnel up even without outgoing traffic. Usually not needed."] },
  { k: "p1.client-resume", cli: "client-resume", type: "enum", vals: ["disable", "enable"], sec: "dialadv", lvl: "expert", sides: { dialup: ["a"] }, since: "7.4",
    it: ["Ripresa della sessione", "Il client riprende il tunnel dopo standby o cambio di rete", "Se il PC va in standby o passa dal Wi-Fi al cavo, il client si ricollega senza rifare login e MFA. Molto comodo per gli utenti. Disponibile da FortiOS 7.4.4."],
    en: ["Session resume", "The client resumes the tunnel after sleep or a network change", "If the PC sleeps or moves from Wi-Fi to cable, the client reconnects without a new sign-in and MFA. Very handy for users. Available from FortiOS 7.4.4."] },
  { k: "p1.client-resume-interval", cli: "client-resume-interval", type: "num", min: 120, max: 172800, sec: "dialadv", lvl: "expert", sides: { dialup: ["a"] }, since: "7.4", dep: ["p1.client-resume", "enable"],
    it: ["Tempo massimo di ripresa (secondi)", "Da 120 a 172800 secondi", "Per quanto tempo dopo la disconnessione il client può riprendere la sessione senza rifare login."], en: ["Maximum resume time (seconds)", "120 to 172800 seconds", "For how long after a disconnection the client can resume the session without signing in again."] },
  { k: "p1.mode-cfg-allow-client-selector", cli: "mode-cfg-allow-client-selector", type: "enum", vals: ["disable", "enable"], def: "disable", sec: "dialadv", lvl: "expert", sides: { dialup: ["a"] },
    it: ["Selettori scelti dal client", "Normalmente spento", "Permette al client di proporre reti diverse da «tutto il traffico». Serve solo con client particolari che lo richiedono; con FortiClient lascialo spento."],

const phL = n => "<" + (PH_LANG === "en" ? (PH_EN[n] || n) : n) + ">";
const ph = (v, name) => (v !== undefined && v !== null && String(v).trim() !== "") ? String(v).trim() : phL(name);
const xmlEsc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
const fosNum = m => Number(m.fos) || 7.4;

function randomPsk(len) {
  const cs = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789-_.+=@%^*~";
  const buf = new Uint32Array(len || 32); (globalThis.crypto || require("crypto").webcrypto).getRandomValues(buf);
  return Array.from(buf, n => cs[n % cs.length]).join("");
}
/* overlay BGP per la filiale a IP dinamico */
function overlayInfo(m) {
  const o = parseNets(m.bgp.overlay).out[0];
  if (!o || o.p > 30) return null;
  return Object.assign({}, o, { bogus: intIp(o.end - 1) });
}

/* ---------- applicabilità opzioni ---------- */
function optApplies(o, m, side) {
  const sides = (o.sides && o.sides[m.scenario]) || [];
  if (!sides.includes(side)) return false;
  if (o.ike && m.crypto.ike !== o.ike) return false;
  if (o.since && Number(m.fos) < Number(o.since)) return false;
  return true;
}
function optDepOk(o, adv) {
  if (!o.dep) return true;
  const [k, v] = o.dep, cur = adv[k];
  if (v.startsWith("!")) return cur !== undefined && cur !== null && cur !== "" && cur !== v.slice(1);
  return cur === v;
}

/* ---------- tunnel per lato (doppia WAN) ---------- */
function tunnelsFor(m, side) {
  const sc = m.scenario, S = m[side], O = m[side === "a" ? "b" : "a"], d = m.dual;
  const T1 = ph(S.tunnel, side === "a" ? "tunnel-A" : "tunnel-B");
  const list = [{ k: 1, name: T1, wan: S.wan, rIp: sc === "s2sdyn" ? m.a.ip : O.ip, rFqdn: sc === "s2sdyn" ? m.a.fqdn : O.fqdn, tip: S.tip, otip: O.tip }];
  if (sc === "s2s" && d.on) {
    const bHas2 = !!(String(d.bIp).trim() || String(d.bFqdn).trim());
    if (side === "a") list.push({ k: 2, name: ph(d.aTunnel, "tunnel-A2"), wan: d.aWan, rIp: bHas2 ? d.bIp : m.b.ip, rFqdn: bHas2 ? d.bFqdn : m.b.fqdn, tip: d.aTip, otip: d.bTip });
    else list.push({ k: 2, name: ph(d.bTunnel, "tunnel-B2"), wan: bHas2 ? d.bWan : m.b.wan, rIp: d.aIp, rFqdn: d.aFqdn, tip: d.bTip, otip: d.aTip });
  }
  return list;
}

/* ---------- generatore FortiGate ---------- */
function genFortiGate(m, side, sec) {
  const S = m[side], O = m[side === "a" ? "b" : "a"], sc = m.scenario, c = m.crypto, dial = DIAL(sc);
  const isHub = (sc === "s2sdyn" && side === "a") || dial;
  const bgpOn = ipsecBgp(m);
  const tunnels = tunnelsFor(m, side);
  const T = tunnels[0].name;
  const L = [];
  const adv = (m.adv && m.adv[side]) || {};
  const advSet = scope => OPTS.filter(o => o.scope === scope && optApplies(o, m, side) && optDepOk(o, adv))
                              .filter(o => adv[o.k] !== undefined && adv[o.k] !== null && adv[o.k] !== "")
                              .filter(o => !(bgpOn && isHub && o.k === "p1.add-route"));
  const d = m.dial;

  // 1. globali e impostazioni di sistema
  if (dial) {
    const g = [];
    if (sc === "dialup" && d.auth === "saml") g.push("    set auth-ike-saml-port " + ph(d.samlPort, "porta"));
    if (String(d.authTimeout).trim()) g.push("    set remoteauthtimeout " + d.authTimeout.trim());
    if (g.length) L.push("config system global", ...g, "end", "");
  }
  if (sc === "dialup" && m.trans.mode !== "udp" && fosNum(m) >= 7.4 && c.ike === "2")
    L.push("config system settings", "    set ike-tcp-port " + ph(m.trans.port, "porta-tcp"), "end", "");
  // 2. server di autenticazione, utenti e gruppi
  if (dial && d.auth === "ldap" && d.ldapCreate) {
    const x = ["config user ldap", "    edit " + q(ph(d.ldapServer, "server-ldap")), "        set server " + q(ph(d.ldapIp, "ip-del-dc")),
      "        set cnid " + q(ph(d.ldapCnid, "sAMAccountName")), "        set dn " + q(ph(d.ldapBase, "dn-base")), "        set type regular",
      "        set username " + q(ph(d.ldapBind, "dn-account-di-bind")), "        set password " + (sec && sec.ldap ? q(sec.ldap) : phL("password-di-bind"))];
    if (d.ldapSecure === "ldaps") x.push("        set secure ldaps", "        set port 636");
    else if (d.ldapSecure === "starttls") x.push("        set secure starttls");
    if (d.ldapNested) x.push("        set search-type recursive");
    L.push(...x, "    next", "end", "");
  }
  if (dial && d.auth === "radius" && d.radiusCreate) {
    const x = ["config user radius", "    edit " + q(ph(d.radiusServer, "server-radius")), "        set server " + q(ph(d.radiusIp, "ip-del-server")),
      "        set secret " + (sec && sec.radius ? q(sec.radius) : phL("segreto-condiviso"))];
    if (String(d.radiusTimeout).trim()) x.push("        set timeout " + d.radiusTimeout.trim());
    L.push(...x, "    next", "end", "");
  }
  if (dial) {
    const G = ph(d.group, "gruppo");
    if (sc === "dialup" && d.auth === "saml") {
      const S2 = ph(d.samlServer, "server-saml"), P = ph(d.samlPort, "porta"), H = ph(m.a.fqdn || m.a.ip, "fqdn"), TN = ph(d.tenant, "id-tenant");
      const sp = "https://" + H + ":" + P + "/remote/saml/";
      L.push("config user saml", "    edit " + q(S2),
        "        set cert " + q(ph(d.spCert, "certificato-sp")),
        "        set entity-id " + q(sp + "metadata"), "        set single-sign-on-url " + q(sp + "login"), "        set single-logout-url " + q(sp + "logout"),
        "        set idp-entity-id " + q("https://sts.windows.net/" + TN + "/"),
        "        set idp-single-sign-on-url " + q("https://login.microsoftonline.com/" + TN + "/saml2"),
        "        set idp-single-logout-url " + q("https://login.microsoftonline.com/" + TN + "/saml2"),
        "        set idp-cert " + q(ph(d.idpCert, "certificato-idp")),
        '        set user-name "username"', '        set group-name "group"', "        set digest-method sha256", "    next", "end", "");
      L.push("config user group", "    edit " + q(G), "        set member " + q(S2), "        config match", "            edit 1",
        "                set server-name " + q(S2), "                set group-name " + q(ph(d.groupId, "id-gruppo-entra")),
        "            next", "        end", "    next", "end", "");
      L.push("config system interface", "    edit " + q(ph(S.wan, "wan")), "        set ike-saml-server " + q(S2), "    next", "end", "");
      if (String(d.authCert).trim()) L.push("config user setting", "    set auth-cert " + q(d.authCert.trim()), "end", "");
    } else if (sc === "dialup" && d.auth === "ldap") {
      const LS = ph(d.ldapServer, "server-ldap");
      L.push("config user group", "    edit " + q(G), "        set member " + q(LS), "        config match", "            edit 1",
        "                set server-name " + q(LS), "                set group-name " + q(ph(d.ldapDN, "dn-gruppo")),
        "            next", "        end", "    next", "end", "");
    } else if (d.auth === "radius") {
      L.push("config user group", "    edit " + q(G), "        set member " + q(ph(d.radiusServer, "server-radius")), "    next", "end", "");
    } else {
      const users = String(d.users).split(",").map(x => x.trim()).filter(Boolean);
      L.push("config user group", "    edit " + q(G), "        set member " + (users.length ? users.map(q).join(" ") : q(phL("utente"))), "    next", "end", "");
    }
  }
  // 3. peer PKI
  const useCert = !dial && m.auth.method === "cert";
  const peerName = side === "a" ? m.auth.peerA : m.auth.peerB;
  if (useCert) {
    const ca = side === "a" ? m.auth.caA : m.auth.caB, cn = side === "a" ? m.auth.cnA : m.auth.cnB;
    L.push("config user peer", "    edit " + q(ph(peerName, "utente-peer")), "        set ca " + q(ph(ca, "ca-peer")));
    if (String(cn).trim()) L.push("        set cn " + q(cn.trim()));
    L.push("    next", "end", "");
  }
  // 4. oggetti split tunnel
  const ownNets = parseNets(S.nets).out;
  const splitName = T + "_split";
  if (dial && d.split === "split" && ownNets.length) {
    L.push("config firewall address");
    ownNets.forEach((n, i) => L.push("    edit " + q(T + "_net" + (i + 1)), "        set subnet " + n.net + " " + n.mask, "    next"));
    L.push("end", "", "config firewall addrgrp", "    edit " + q(splitName),
      "        set member " + ownNets.map((n, i) => q(T + "_net" + (i + 1))).join(" "), "    next", "end", "");
  }

  const exclNets = parseNets(d.exclude).out, exclName = T + "_exclude";
  if (dial && d.split === "full" && exclNets.length) {
    L.push("config firewall address");
    exclNets.forEach((n, i) => L.push("    edit " + q(T + "_excl" + (i + 1)), "        set subnet " + n.net + " " + n.mask, "    next"));
    L.push("end", "", "config firewall addrgrp", "    edit " + q(exclName),
      "        set member " + exclNets.map((n, i) => q(T + "_excl" + (i + 1))).join(" "), "    next", "end", "");
  }
  const listQ = v => String(v || "").split(/[\s,;]+/).map(x => x.trim()).filter(Boolean).map(q).join(" ");
  // 5. phase1 (uno per tunnel)
  const nid = parseInt(m.ident.networkId, 10);
  L.push("config vpn ipsec phase1-interface");
  tunnels.forEach(t => {
    let type = "static";
    if (isHub) type = "dynamic"; else if (!String(t.rIp || "").trim() && String(t.rFqdn || "").trim()) type = "ddns";
    const p1 = ["    edit " + q(t.name), "        set type " + type, "        set interface " + q(ph(t.wan, "wan")), "        set ike-version " + c.ike];
    if (c.ike === "1") p1.push("        set mode " + c.mode);
    if (useCert) {
      p1.push("        set authmethod signature", "        set certificate " + q(ph(side === "a" ? m.auth.certA : m.auth.certB, "certificato")),
        "        set peertype peer", "        set peer " + q(ph(peerName, "utente-peer")));
    } else if (sc === "s2sdyn" && side === "a" && m.ident.peerMode === "one") p1.push("        set peertype one", "        set peerid " + q(ph(m.ident.localid, "local-id-filiale")));
    else p1.push("        set peertype any");
    if (sc === "s2sdyn" && side === "b" && String(m.ident.localid).trim()) p1.push("        set localid " + q(m.ident.localid.trim()));
    if (type === "static") p1.push("        set remote-gw " + ph(t.rIp, "ip-remoto"));
    else if (type === "ddns") p1.push("        set remotegw-ddns " + q(t.rFqdn));
    if ((sc === "dialup" || sc === "s2sdyn") && c.ike === "2" && nid > 0) p1.push("        set network-overlay enable", "        set network-id " + nid);
    p1.push("        set proposal " + (c.p1.length ? c.p1.join(" ") : phL("proposte")), "        set dhgrp " + (c.dh1.length ? c.dh1.join(" ") : phL("gruppi-dh")));
    if (String(c.life1).trim()) p1.push("        set keylife " + c.life1.trim());
    if (dial) {
      if (c.ike === "2") p1.push("        set eap enable", "        set eap-identity send-request", "        set authusrgrp " + q(ph(d.group, "gruppo")));
      else p1.push("        set xauthtype auto", "        set authusrgrp " + q(ph(d.group, "gruppo")));
      p1.push("        set mode-cfg enable", "        set ipv4-start-ip " + ph(d.poolStart, "primo-ip"), "        set ipv4-end-ip " + ph(d.poolEnd, "ultimo-ip"));
      if (String(d.dns1).trim()) p1.push("        set ipv4-dns-server1 " + d.dns1.trim());
      if (String(d.dns2).trim()) p1.push("        set ipv4-dns-server2 " + d.dns2.trim());
      if (d.split === "split" && ownNets.length) p1.push("        set ipv4-split-include " + q(splitName));
      if (d.split === "full" && exclNets.length) p1.push("        set ipv4-split-exclude " + q(exclName));
      if (fosNum(m) >= 7.4 && listQ(d.domains)) p1.push("        set internal-domain-list " + listQ(d.domains));
      if (fosNum(m) >= 7.6 && listQ(d.suffix)) p1.push("        set dns-suffix-search " + listQ(d.suffix));
      if (c.ike === "1") p1.push("        set unity-support enable");
    }
    if (sc === "dialup" && c.ike === "2" && m.trans.mode !== "udp" && fosNum(m) >= 7.4) {
      if (m.trans.mode === "auto" && fosNum(m) >= 7.6) {
        p1.push("        set transport auto");
        if (String(m.trans.threshold).trim()) p1.push("        set auto-transport-threshold " + m.trans.threshold.trim());
      } else p1.push("        set transport tcp");
    }
    if (isHub && fosNum(m) >= 7.4 && m.gwm.mode !== "any") {
      const g = m.gwm;
      p1.push("        set remote-gw-match " + g.mode);
      if (g.mode === "ipmask") { const n = parseNets(g.subnet).out[0]; p1.push("        set remote-gw-subnet " + (n ? n.net + " " + n.mask : phL("rete"))); }
      else if (g.mode === "iprange") p1.push("        set remote-gw-start-ip " + ph(g.start, "primo-ip"), "        set remote-gw-end-ip " + ph(g.end, "ultimo-ip"));
      else if (g.mode === "geography") p1.push("        set remote-gw-country " + q(ph(String(g.country).trim().toUpperCase(), "paese")));
    }
    if (t.k === 2 && m.dual.mode === "standby") {
      p1.push("        set monitor " + q(tunnels[0].name));
      if (m.dual.holdType === "delay") p1.push("        set monitor-hold-down-type delay", "        set monitor-hold-down-delay " + ph(m.dual.holdDelay, "secondi"));
    }
    const fecOn = (sc === "s2s" || sc === "s2sdyn") && m.fec.on;
    if (fecOn) {
      p1.push("        set npu-offload disable", "        set fec-egress enable", "        set fec-ingress enable");
      if (String(m.fec.base).trim()) p1.push("        set fec-base " + m.fec.base.trim());
      if (String(m.fec.redundant).trim()) p1.push("        set fec-redundant " + m.fec.redundant.trim());
    }
    if (bgpOn && isHub) p1.push("        set add-route disable");
    advSet("p1").filter(o => !(fecOn && o.k === "p1.npu-offload")).forEach(o => p1.push("        set " + o.cli + " " + (o.type === "text" ? q(adv[o.k]) : adv[o.k])));
    if (!useCert) p1.push("        set psksecret " + (sec && sec.psk ? q(sec.psk) : "<PSK>"));
    if (adv["p1.ppk"] && adv["p1.ppk"] !== "disable" && c.ike === "2") p1.push("        set ppk-secret " + (sec && sec.ppk ? q(sec.ppk) : "<PPK>"));
    p1.push("    next");
    L.push(...p1);
  });
  L.push("end", "");

  // 6. phase2
  const p2common = ["        set proposal " + (c.p2.length ? c.p2.join(" ") : phL("proposte"))];
  if (c.pfs === "enable") p2common.push("        set dhgrp " + (c.dh2.length ? c.dh2.join(" ") : phL("gruppi-dh")));
  else p2common.push("        set pfs disable");
  if (String(c.life2).trim() && adv["p2.keylife-type"] !== "kbs") p2common.push("        set keylifeseconds " + c.life2.trim());
  advSet("p2").forEach(o => p2common.push("        set " + o.cli + " " + adv[o.k]));
  const remote = parseNets(O.nets).out;
  const useSubnets = (sc === "s2s" && m.sel.mode === "subnets") || (sc === "s2sdyn" && side === "b" && !bgpOn);
  L.push("config vpn ipsec phase2-interface");
  tunnels.forEach(t => {
    if (useSubnets && ownNets.length && remote.length) {
      let i = 0;
      ownNets.forEach(ln => remote.forEach(rn => {
        i++;
        L.push("    edit " + q(t.name + "_p2_" + i), "        set phase1name " + q(t.name), ...p2common,
          "        set src-subnet " + ln.net + " " + ln.mask, "        set dst-subnet " + rn.net + " " + rn.mask, "    next");
      }));
    } else L.push("    edit " + q(t.name), "        set phase1name " + q(t.name), ...p2common, "    next");
  });
  L.push("end", "");

  // 7. IP delle interfacce tunnel
  const ifs = [];
  if (sc === "s2s") {
    const pre = Number(m.tunPrefix) || 30;
    tunnels.forEach(t => { if (isIp(t.tip) && isIp(t.otip)) ifs.push("    edit " + q(t.name), "        set ip " + t.tip + " 255.255.255.255",
      "        set remote-ip " + t.otip + " " + maskOf(pre), "        set allowaccess ping", "    next"); });
  } else if (sc === "s2sdyn" && bgpOn) {
    const ov = overlayInfo(m);
    if (ov && isIp(S.tip)) ifs.push("    edit " + q(T), "        set ip " + S.tip + " 255.255.255.255", "        set remote-ip " + ov.bogus + " " + ov.mask, "        set allowaccess ping", "    next");
  }
  if (ifs.length) L.push("config system interface", ...ifs, "end", "");

  // 8. rotte statiche e blackhole
  const routes = [];
  const label = O.label ? O.label : (side === "a" ? "B" : "A");
  if (!dial && remote.length) {
    const viaTunnel = m.route.on && !bgpOn && !(sc === "s2sdyn" && side === "a");
    remote.forEach(n => {
      if (viaTunnel) tunnels.forEach(t => {
        const dist = t.k === 1 || m.dual.mode === "ecmp" ? String(m.route.distance).trim() : String(m.dual.backupDist).trim();
        routes.push("    edit 0", "        set dst " + n.net + " " + n.mask, "        set device " + q(t.name));
        if (dist) routes.push("        set distance " + dist);
        routes.push("        set comment " + q("VPN " + label + (t.k === 2 ? " (WAN 2)" : "")), "    next");
      });
      if (m.route.bh) routes.push("    edit 0", "        set dst " + n.net + " " + n.mask, "        set blackhole enable",
        "        set distance " + (String(m.route.bhDistance).trim() || "254"), "        set comment " + q("Blackhole VPN " + label), "    next");
    });
  }
  if (routes.length) L.push("config router static", ...routes, "end", "");

  // 9. BGP
  if (bgpOn && !advOn(m)) L.push(...genBgp(m, side, tunnels, sec), "");

  while (L.length && L[L.length - 1] === "") L.pop();
  return L.join("\n");
}

function genBgp(m, side, tunnels, sec) {
  const b = m.bgp, sc = m.scenario;
  const as = side === "a" ? b.asA : b.asB, ras = side === "a" ? b.asB : b.asA;
  const ibgp = String(b.asA).trim() !== "" && String(b.asA).trim() === String(b.asB).trim();
  const rid = String(side === "a" ? b.ridA : b.ridB).trim();
  const own = parseNets(m[side].nets).out;
  const ind = n => " ".repeat(n);
  const nb = n => {
    const x = [ind(n) + "set remote-as " + ph(ras, "as-remoto")];
    if (b.soft) x.push(ind(n) + "set soft-reconfiguration enable");
    if (b.ldf) x.push(ind(n) + "set link-down-failover enable");
    if (String(b.keepalive).trim()) x.push(ind(n) + "set keep-alive-timer " + b.keepalive.trim());
    if (String(b.holdtime).trim()) x.push(ind(n) + "set holdtime-timer " + b.holdtime.trim());
    if (sec && sec.bgp) x.push(ind(n) + "set password " + q(sec.bgp));
    return x;
  };
  const L = ["config router bgp", "    set as " + ph(as, "as-locale")];
  if (rid) L.push("    set router-id " + rid);
  if (b.gr) L.push("    set graceful-restart enable");
  if (sc === "s2s" && m.dual.on) L.push(ibgp ? "    set ibgp-multipath enable" : "    set ebgp-multipath enable");
  if (sc === "s2sdyn" && side === "a") {
    const ov = overlayInfo(m), G = tunnels[0].name + "_peers";
    L.push("    config neighbor-group", "        edit " + q(G), ...nb(12));
    if (ibgp) L.push("            set route-reflector-client enable");
    L.push("        next", "    end", "    config neighbor-range", "        edit 1",
      "            set prefix " + (ov ? ov.net + " " + ov.mask : phL("rete-overlay")), "            set neighbor-group " + q(G), "        next", "    end");
  } else {
    const peers = sc === "s2sdyn" ? [m.a.tip] : tunnels.map(t => t.otip);
    L.push("    config neighbor");
    peers.forEach(p => L.push("        edit " + q(ph(p, "ip-tunnel-remoto")), ...nb(12), "        next"));
    L.push("    end");
  }
  if (own.length) {
    L.push("    config network");
    own.forEach((n, i) => L.push("        edit " + (i + 1), "            set prefix " + n.net + " " + n.mask, "        next"));
    L.push("    end");
  }
  L.push("end");
  return L;
}

/* ---------- FortiClient XML ---------- */
function genXml(m, sec) {
  const c = m.crypto, d = m.dial, nid = parseInt(m.ident.networkId, 10);
  const now = new Date(), date = now.getFullYear() + "/" + String(now.getMonth() + 1).padStart(2, "0") + "/" + String(now.getDate()).padStart(2, "0");
  const i = n => " ".repeat(n);
  const p1 = c.p1.map(p => FCT_P1[p]).filter(Boolean), p2 = c.p2.map(p => FCT_P2[p]).filter(Boolean);
  const tm = { udp: 0, tcp: 1, auto: 2 }[m.trans.mode] || 0;
  const L = ['<?xml version="1.0" encoding="UTF-8" ?>', "<forticlient_configuration>",
    i(4) + "<forticlient_version>7.4.3.6002</forticlient_version>", i(4) + "<version>7.4.3</version>",
    i(4) + "<exported_by_version>7.4.3.6002</exported_by_version>", i(4) + "<date>" + date + "</date>",

/* ---------- diagnostica ---------- */
function genDiag(m, side, lang) {
  const it = lang !== "en", S = m[side], O = m[side === "a" ? "b" : "a"], sc = m.scenario, dial = DIAL(sc);
  const tunnels = tunnelsFor(m, side), T = tunnels[0].name;
  const peerIp = dial ? (it ? "<IP pubblico del client>" : "<client public IP>")
               : (sc === "s2sdyn" && side === "a") ? (it ? "<IP pubblico della filiale>" : "<branch public IP>")
               : ph(sc === "s2sdyn" ? m.a.ip : O.ip, it ? "IP-del-peer" : "peer-IP");
  const nid = parseInt(m.ident.networkId, 10) || 0;
  const L = [], h = s => L.push("# " + s);
  h(it ? "1. Stato del tunnel" : "1. Tunnel status");
  L.push("get vpn ipsec tunnel summary");
  tunnels.forEach(t => L.push("diagnose vpn ike gateway list name " + t.name, "diagnose vpn tunnel list name " + t.name));
  L.push("");
  if (!dial) {
    h(it ? "2. Rotte verso le reti remote" : "2. Routes to remote networks");
    L.push("get router info routing-table all");
    if (m.bgp.on && !advOn(m)) L.push("get router info bgp summary", "get router info routing-table bgp");
    L.push("");
  }
  h(it ? "3. Debug della negoziazione (ripeti la connessione mentre è attivo)" : "3. Negotiation debug (retry the connection while it runs)");
  L.push("diagnose debug reset", "diagnose vpn ike log filter clear", "diagnose vpn ike log filter rem-addr4 " + peerIp,
    "diagnose debug console timestamp enable", "diagnose debug application ike -1");
  if (dial) L.push("diagnose debug application " + (sc === "dialup" && m.dial.auth === "saml" ? "samld" : "fnbamd") + " -1");
  L.push("diagnose debug enable", "", "# " + (it ? "al termine:" : "when done:"), "diagnose debug disable", "diagnose debug reset", "");
  h(it ? "Cosa cercare nell’output del debug" : "What to look for in the debug output");
  if (sc === "dialup" || (sc === "s2sdyn" && side === "a")) {
    if (m.crypto.ike === "2") L.push("#   NETWORK ID : " + nid);
    L.push("#   matched gateway " + T + "   (" + (it ? "se compare un altro nome, il tunnel scelto è sbagliato" : "if another name appears, the wrong tunnel was chosen") + ")");
  }
  L.push("#   " + (it ? "no SA proposal chosen = proposte o gruppi DH diversi tra i lati" : "no SA proposal chosen = proposals or DH groups differ between sides"));
  if (dial) L.push("#   EAP succeeded / EAP failed = " + (it ? "esito dell’autenticazione utente" : "user authentication result"));
  else L.push("#   " + (it ? "authentication failed / AUTHENTICATION_FAILED = PSK o certificati non corrispondenti" : "authentication failed / AUTHENTICATION_FAILED = PSK or certificates do not match"));
  L.push("#   " + (it ? "established IKE SA / added IPsec SA = tunnel su" : "established IKE SA / added IPsec SA = tunnel up"));
  if (!dial && m.bgp.on && !advOn(m)) L.push("#   " + (it ? "bgp summary: State/PfxRcd con un numero = sessione BGP stabilita" : "bgp summary: a number in State/PfxRcd = BGP session established"));
  return L.join("\n");
}

      IF.push("    edit " + q(name), "        set ip " + me + " 255.255.255.255", "        set remote-ip " + ot + " " + mask, "        set allowaccess ping", "    next");
    }

  const L = ["config vpn ipsec phase1-interface", ...P1, "end", "", "config vpn ipsec phase2-interface", ...P2, "end", ""];
  if (IF.length) L.push("config system interface", ...IF, "end", "");
